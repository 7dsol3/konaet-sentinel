  <path d="M66 36c-4.5-7-13-10-21-7.5-8.5 2.8-11 12-3.5 16.8l10.5 6.2c7.7 4.6 6.6 13.8-2.2 17.2-7.2 2.8-15.5.2-20.8-6" fill="none" stroke="url(#ribbon)" stroke-width="5.2" stroke-linecap="round"/>
  <circle cx="70" cy="67" r="3.1" fill="#b06043"/>
