      <stop offset=".55" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#8d7a61" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
