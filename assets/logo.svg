<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Konaet Sentinel">
  <defs>
    <radialGradient id="pearl" cx="30%" cy="18%" r="90%">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset=".42" stop-color="#f3eadb"/>
      <stop offset=".72" stop-color="#ded1bc"/>
      <stop offset="1" stop-color="#c9b89f"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
